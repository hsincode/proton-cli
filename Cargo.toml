[package]
# crates.io の package 名（`proton-cli` は 0.0.0 スタブに占有されているため protoncli）
name = "protoncli"
version = "0.1.6"
edition = "2021"
rust-version = "1.80"
description = "CLI launcher for Windows games/apps via umu + Proton (dwproton by default)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://codeberg.org/xuanling/proton-cli"
homepage = "https://codeberg.org/xuanling/proton-cli"
keywords = ["wine", "proton", "umu", "gaming", "linux"]
categories = ["command-line-utilities", "games"]
authors = ["xuanling"]
exclude = [".git*", "target/"]

[[bin]]
# crates.io パッケージ名・コマンド名とも protoncli（旧 proton-cli バイナリ名は廃止）
name = "protoncli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
hex = "0.4.3"
indicatif = "0.18.6"
ratatui = "0.29.0"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.19"
toml = "1.1.3"
which = "8.0.5"
xz2 = "0.1.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
# 配布バイナリを小さくする（速度は CLI 用途では体感差なし）
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
