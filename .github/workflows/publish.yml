name: Publish

# v* タグの push、または手動実行で crates.io 公開 + GitHub Release 作成
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースタグ（例: v0.1.0）。既存タグが対象。'
        required: true

permissions:
  contents: write

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::Repository secret CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
          # 同じ版が既に公開済み（手動 publish・再実行）なら成功扱いにして
          # github-release を続行する。
          set +e
          OUT=$(cargo publish --locked 2>&1)
          RC=$?
          set -e
          printf '%s\n' "${OUT}"
          if [ "${RC}" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "${OUT}" | grep -qE 'already exists on crates\.io'; then
            echo "==> Version already on crates.io; treating as success"
            exit 0
          fi
          exit "${RC}"

  github-release:
    needs: crates-io
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "==> Release ${TAG} already exists"
            exit 0
          fi
          gh release create "${TAG}" \
            --title "protoncli ${TAG}" \
            --notes "Published to crates.io as **protoncli**. Install: \`cargo install protoncli\` (binary: protoncli)" \
            --generate-notes
